name: Site

# Compila o KIT Core e publica o site (web-installer/) no GitHub Pages,
# com o firmware embutido para gravação via navegador (ESP Web Tools).
# Requer: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'web-installer/**'
      - 'firmware/**'
      - '.github/workflows/pages.yml'
  # Republica o site (e o firmware.json) quando sai uma Release de firmware.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Versão
        run: echo "KIT_VERSION=$(date -u +%Y.%m.%d)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Compilar KIT Core (ESP-IDF v5.3, esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: firmware

      - name: Montar site + firmware para o ESP Web Tools
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp -r web-installer/. _site/

          python3 - <<'PY'
          import json, os, shutil

          build = "firmware/build"
          with open(f"{build}/flasher_args.json") as f:
              flasher = json.load(f)

          parts = []
          for offset, relpath in flasher["flash_files"].items():
              name = os.path.basename(relpath)
              shutil.copy(f"{build}/{relpath}", f"_site/firmware/{name}")
              parts.append({"path": name, "offset": int(offset, 16)})
          parts.sort(key=lambda p: p["offset"])

          manifest = {
              "name": "KIT",
              "version": os.environ.get("KIT_VERSION", "dev"),
              "new_install_prompt_erase": True,
              "builds": [{"chipFamily": "ESP32-S3", "parts": parts}],
          }
          with open("_site/firmware/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Gerar firmware.json (manifesto OTA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(tr -d '[:space:]' < firmware/version.txt)"
          TAG="fw-v${VER}"
          BIN="firmware/build/kit_core.bin"

          # Só publica o manifesto OTA quando a Release com o .bin já existe —
          # senão o dispositivo baixaria uma URL 404.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ainda não existe — pulando firmware.json."
            exit 0
          fi

          SHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$BIN")"
          VC="$(echo "$VER" | awk -F. '{ printf "%d", ($1*10000)+($2*100)+$3 }')"
          NOTES="$(git tag -l --format='%(contents:subject)' "$TAG" | head -c 160)"
          [ -n "$NOTES" ] || NOTES="Atualização do KIT Core ${VER}."

          jq -n \
            --arg version "$VER" \
            --argjson version_code "$VC" \
            --arg notes "$NOTES" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kit_core.bin" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            '{version:$version, version_code:$version_code, notes:$notes, url:$url, sha256:$sha256, size:$size}' \
            | tee _site/firmware.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
