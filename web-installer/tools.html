<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIT · instalador de Tools</title>
    <meta name="description" content="Envie arquivos .kit para um aparelho que já roda o KIT, pela porta serial do navegador.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./" aria-label="KIT">
            <svg class="brand-mark" viewBox="0 0 96 32" aria-hidden="true">
                <rect x="2" y="6" width="20" height="20" fill="#C6472F"/>
                <circle cx="48" cy="16" r="11" fill="#2C3CC4"/>
                <path d="M74 4 L92 30 L56 30 Z" fill="#E9B23C"/>
            </svg>
            <span class="brand-word">KIT</span>
        </a>
        <nav class="site-nav">
            <a href="./">Início</a>
            <a href="https://jcrvlh.github.io/kit-tools/">Catálogo</a>
            <a href="https://github.com/jcrvlh/kit">GitHub</a>
        </nav>
    </header>

    <main class="tools-main">
        <a class="back-link" href="./">&larr; Voltar</a>
        <div>
            <h1 style="font-family:var(--display);font-size:1.9rem;color:var(--text)">Instalador de Tools</h1>
            <p style="color:#b7b2a6;margin-top:0.5rem">
                Para um aparelho que <strong>já roda o KIT</strong>. Envia um arquivo
                <code>.kit</code> pela porta serial. Precisa de Chrome, Edge ou Opera no desktop.
            </p>
        </div>

        <section id="connection-panel" class="panel">
            <div class="status-indicator" id="status-dot"></div>
            <h2 id="status-text">DESCONECTADO</h2>
            <button id="btn-connect" class="btn btn-primary">CONECTAR AO KIT</button>
        </section>

        <section id="upload-panel" class="panel disabled">
            <div id="drop-zone" class="drop-zone">
                <p>ARRASTE UM ARQUIVO <strong>.KIT</strong> AQUI</p>
                <p class="small-text">Ou clique para selecionar</p>
                <input type="file" id="file-input" accept=".kit,.zip" style="display: none;">
            </div>

            <div id="progress-container" class="hidden">
                <h3 id="progress-title">NOME DA TOOL</h3>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="progress-status">Preparando...</p>
            </div>
        </section>

        <section id="log-panel" class="panel">
            <h3 style="color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;font-size:0.8rem;margin-bottom:0.75rem">Logs do sistema</h3>
            <div id="log-console" class="console"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
